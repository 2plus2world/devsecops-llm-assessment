# Model verification CronJob
# Checks that the configured model is listed by the Ollama API.
# This is an availability check, NOT a cryptographic model checksum check.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: llm-model-availability-check
  namespace: devsecops-llm
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: check-model
              image: curlimages/curl:8.12.1
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -ec
                - |
                  curl --fail --silent --show-error http://llm:11434/api/tags \
                    -o /tmp/tags.json
                  grep -q 'qwen2.5:0.5b' /tmp/tags.json
                  echo "Configured model is present in Ollama API."
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
